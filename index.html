    .search-wrap { position: sticky; top: 0; z-index: 50; background: #16161e; padding: 10px 0 14px; }
    #search { width: 100%; padding: 13px 18px; font-size: 1rem; border-radius: 25px; border: 2px solid #45475a; background: #1e1e2e; color: #cdd6f4; outline: none; transition: .2s; }
    #search:focus { border-color: #cba6f7; }
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 20px; }
    .tab-btn { padding: 8px 16px; border-radius: 25px; background: #1e1e2e; border: 1px solid #45475a; color: #cdd6f4; cursor: pointer; transition: .15s; font-size: 0.92rem; user-select: none; }
    .tab-btn:hover { border-color: #cba6f7; }
    .tab-btn.active { background: #cba6f7; color: #16161e; border-color: #cba6f7; font-weight: 700; }
    .count { opacity: .7; font-size: .78rem; font-weight: 600; margin-left: 4px; }
    .quick { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
    .quick span { background: #26263a; border: 1px solid #45475a; padding: 7px 13px; border-radius: 20px; cursor: pointer; font-size: .88rem; transition: .15s; }
    .quick span:hover { border-color: #f5c2e7; background: #313244; }
    .quick .badge { background: #1e1e2e; border-color: #cba6f7; color: #cba6f7; margin-right: 4px; cursor: default; }
    .category { margin-bottom: 34px; }
    .category > h2 { font-size: 1.25rem; color: #f5c2e7; border-bottom: 2px solid #3a3a52; padding-bottom: 6px; margin-bottom: 12px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, auto)); gap: 10px; }
    .card { background: #1e1e2e; border: 1px solid #2e2e44; border-radius: 12px; padding: 11px 13px; transition: .15s; }
    .card:hover { border-color: #cba6f7; background: #26263a; }
    .card .cmd { font-weight: 700; font-size: .98rem; color: #f2cdcd; cursor: pointer; word-break: break-word; }
    .card .cmd:hover { color: #f5c2e7; text-decoration: underline; }
    .card .desc { color: #a6adc8; font-size: .86rem; margin-top: 3px; line-height: 1.4; }
    .card .ex { color: #89b4fa; font-family: ui-monospace, Consolas, monospace; font-size: .8rem; margin-top: 5px; background: #16161e; border-radius: 6px; padding: 4px 7px; display: inline-block; }
    .badge { display: inline-block; font-size: .72rem; background: #313244; color: #89b4fa; border-radius: 10px; padding: 2px 8px; margin-bottom: 5px; }
    .no-results { text-align: center; color: #a6adc8; padding: 40px; }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #a6e3a1; color: #16161e; font-weight: 700; padding: 10px 20px; border-radius: 25px; opacity: 0; transition: .25s; pointer-events: none; z-index: 99; font-size: .9rem; }
    .toast.show { opacity: 1; }
    table { width: 100%; border-collapse: collapse; margin: 8px 0 26px; font-size: .9rem; }
    th { text-align: left; color: #f5c2e7; padding: 8px 10px; border-bottom: 2px solid #45475a; font-size: .85rem; }
    td { padding: 7px 10px; border-bottom: 1px solid #2e2e44; }
    tr:hover td { background: #1e1e2e; }
    .ref-h { color: #89b4fa; font-size: 1.05rem; margin: 22px 0 4px; }
    .ref-note { color: #a6adc8; font-size: .85rem; margin-bottom: 4px; }
    .disease-card { background: #1e1e2e; border: 1px solid #45475a; border-radius: 12px; padding: 13px 15px; margin-bottom: 11px; }
    .disease-name { font-weight: 700; font-size: 1.05rem; color: #a6e3a1; margin-bottom: 4px; }
    .disease-desc { color: #cdd6f4; font-size: .9rem; margin-bottom: 5px; }
    .disease-keys { color: #a6adc8; font-size: .82rem; }
    .admin-block { background: #1e1e2e; border-radius: 14px; padding: 20px; }
    .admin-command { padding: 9px 12px; border-bottom: 1px solid #2e2e44; font-size: .92rem; }
    .admin-command span { color: #f2cdcd; font-weight: 700; margin-right: 8px; }
    .sys-group { color: #89b4fa; margin: 16px 0 8px; font-size: 1.02rem; }
    .guide { color: #cdd6f4; font-size: .93rem; line-height: 1.5; }
    .guide b { color: #f2cdcd; }
    .muted { color: #a6adc8; }
    .search-res .card { display: block; }

  }

  function renderUpdates() {

        <div class="admin-command"><span>🚨 Анти-фарм</span> — автодетект круговых переводов между своими аккаунтами (дважды в обе стороны за 10 мин): оба временно мучаются, админ снимает «.размут»</div>
        <div class="admin-command"><span>📌 инфо с примерами</span> — «инфо <команда>» теперь показывает пример использования: «инфо казино» → «казино кубик 50»</div>

  // ============ ГЛОБАЛЬНЫЙ ПОИСК ============
  function globalSearch(q) {
    const query = q.toLowerCase().trim();
    const res = [];
    for (const it of SYS) if ((it.cmd + ' ' + it.desc).toLowerCase().includes(query)) res.push({ badge: '⚙️ ' + it.g, cmd: it.cmd, desc: it.desc });
    for (const [key, example] of rpCommands) if (key.toLowerCase().includes(query)) res.push({ badge: '🎭 RP', cmd: key, desc: example });
    for (const [cmd, desc] of ADMIN) if ((cmd + ' ' + desc).toLowerCase().includes(query)) res.push({ badge: '🛡️ Админ', cmd, desc });
    for (const [e, n, p] of BIZ) if (n.toLowerCase().includes(query)) res.push({ badge: '💼 Бизнес', cmd: n, desc: 'Цена ' + p.toLocaleString('ru-RU') + '🎡' });
    for (const [e, n, p] of HOUSES) if (n.toLowerCase().includes(query)) res.push({ badge: '🏠 Дом', cmd: n, desc: p.toLocaleString('ru-RU') + '🎡' });
    for (const [e, n, p, d] of PROFS) if ((n + ' ' + d).toLowerCase().includes(query)) res.push({ badge: '🎭 Профессия', cmd: n, desc: p.toLocaleString('ru-RU') + '🎡 — ' + d });
    for (const [e, n, v, ing, d] of DRUGS) if ((n + ' ' + d).toLowerCase().includes(query)) res.push({ badge: '🧪 Наркота', cmd: n, desc: v + '🎡 — ' + d });
    for (const [e, n, v] of DINGS) if (n.toLowerCase().includes(query)) res.push({ badge: '🌿 Ингредиент', cmd: n, desc: v + '🎡' });
    for (const [e, n, ing, p, d] of RECIPES) if (n.toLowerCase().includes(query)) res.push({ badge: '🥐 Рецепт', cmd: n, desc: p + '🎡 — ' + d });
    for (const [e, n, p, d] of SHOP) if (n.toLowerCase().includes(query)) res.push({ badge: '🎒 Предмет', cmd: n, desc: p + '🎡 — ' + d });
    for (const d of DISEASES) if (d.name.toLowerCase().includes(query)) res.push({ badge: '🦠 Болезнь', cmd: d.name, desc: 'Лечение ' + d.cure + '🎡' });
    if (!res.length) {
      content.innerHTML = '<div class="no-results">😕 Ничего не найдено по «' + esc(q) + '»</div>';
      return;
    }
    content.innerHTML = '<h2 style="color:#cba6f7;margin-bottom:14px">🔍 Результаты: ' + res.length + '</h2><div class="cards search-res">' +
      res.map(r => cardHTML(r.cmd, r.desc, null, r.badge)).join('') + '</div>';
  }

  function renderAll() {
    renderQuick();
    const q = search.value.trim();
    if (q) { globalSearch(q); return; }
    if (activeTab === 'sys') renderSys();
    else if (activeTab === 'rp') renderRP();
    else if (activeTab === 'ref') renderRef();
    else if (activeTab === 'dis') renderDiseases();
    else if (activeTab === 'admin') renderAdmin();
    else if (activeTab === 'newbie') renderNewbie();
    else if (activeTab === 'upd') renderUpdates();
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-copy]');
    if (el) copy(el.getAttribute('data-copy'));
  });

  search.addEventListener('input', renderAll);
  renderTabs();
  renderAll();

})();
</script>
